<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PicFinder AI — Semantisk Bildsökning</title>
  <style>
    :root {
      --bg-dark: #121214;
      --text-main: #ffffff;
      --text-muted: #9898a0;
      --primary-btn: linear-gradient(90deg, #3a82f6, #1d4ed8);
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.1);
      --icon-gradient: linear-gradient(135deg, #a855f7, #3b82f6);
      --accent-red: #ff3b30;
      --accent-green: #30d158;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, rgba(58, 130, 246, 0.12) 0%, transparent 70%);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      padding-bottom: 120px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      padding: 20px 24px 10px;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(18,18,20,0.85);
      border-bottom: 1px solid var(--glass-border);
    }
    
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; font-size: 14px; font-weight: 600; color: var(--text-muted);
    }
    .top-bar .logo-small { display: flex; align-items: center; gap: 6px; color: var(--text-main); }
    .top-bar .logo-small svg { width: 18px; height: 18px; color: #8b5cf6; }

    header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }

    /* AI Model Status Indicator */
    .ai-status-bar {
      display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted);
      background: rgba(0,0,0,0.3); padding: 6px 12px; border-radius: 20px; width: fit-content;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #eab308; }
    .status-dot.ready { background: var(--accent-green); }
    .status-dot.error { background: var(--accent-red); }

    .view { display: none; padding: 16px 24px 20px; animation: fade 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
    .view.active { display: block; }
    
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Empty state */
    .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 40px; }
    .main-gradient-icon {
      width: 80px; height: 80px; background: var(--icon-gradient); border-radius: 24px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
    }
    .main-gradient-icon svg { width: 40px; height: 40px; color: white; }
    .empty-state h2 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; line-height: 1.5; color: var(--text-muted); max-width: 300px; margin-bottom: 30px; }

    .btn-stacked { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 16px; border-radius: 18px; font-size: 16px; font-weight: 600;
      border: none; cursor: pointer; color: white; transition: transform 0.1s, background 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--primary-btn); box-shadow: 0 4px 15px rgba(58, 130, 246, 0.3); }
    .btn.secondary { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(10px); }

    /* Search & Grid */
    .search-box {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
    }
    .search-box input { border: none; outline: none; flex: 1; font-size: 16px; background: transparent; color: var(--text-main); }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box svg { color: var(--text-muted); width: 20px; height: 20px; }

    .search-btn-icon {
      background: var(--primary-btn); border: none; color: white; border-radius: 12px;
      padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }

    .ai-feedback { font-size: 13px; color: #a855f7; margin-bottom: 16px; min-height: 18px; font-weight: 500; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-item { position: relative; cursor: pointer; border-radius: 12px; overflow: hidden; aspect-ratio: 1/1;}
    .grid img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; transition: transform 0.3s; display: block;}
    .grid-item:active img { transform: scale(0.92); }
    .score-badge {
      position: absolute; bottom: 6px; right: 6px; font-size: 10px; font-weight: 700;
      background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2);
      color: var(--accent-green); padding: 2px 6px; border-radius: 8px; backdrop-filter: blur(4px);
    }

    /* Modals & Overlays */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
      z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .modal-content { max-width: 100%; max-height: 60vh; border-radius: 16px; object-fit: contain; box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 12px; }
    .modal-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: white; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .modal-btn.danger { color: var(--accent-red); border-color: rgba(255,59,48,0.3); }
    .modal-close { position: absolute; top: 20px; right: 20px; background: var(--glass-bg); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 210;}

    /* Spinner & Progress */
    .spinner {
      width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #3a82f6; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-bar-wrap { width: 240px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 14px; }
    .progress-bar-fill { width: 0%; height: 100%; background: var(--primary-btn); transition: width 0.2s; }

    /* Toast */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(40,40,45,0.95); backdrop-filter: blur(10px); color: white;
      padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 300;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Tab Bar */
    .tabbar-container { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; z-index: 100; pointer-events: none; }
    nav.tabbar {
      pointer-events: auto; display: flex; align-items: center;
      background: rgba(30, 30, 34, 0.75); backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px; padding: 8px 16px; gap: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text-muted); font-size: 11px; font-weight: 500; border: none; background: none;
      cursor: pointer; padding: 8px 12px; border-radius: 20px; transition: all 0.3s;
    }
    .tab svg { width: 24px; height: 24px; transition: all 0.3s; }
    .tab.active { color: var(--text-main); }
    .tab.active svg { transform: scale(1.1); stroke-width: 2.5; }
  </style>
</head>
<body>

<input type="file" id="fileInput" accept="image/*" multiple style="display:none">

<header>
  <div class="top-bar">
    <div class="logo-small">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 16H6c-.55 0-1-.45-1-1V6c0-.55.45-1 1-1h12c.55 0 1 .45 1 1v12c0 .55-.45 1-1 1zm-4.44-6.19l-2.35 3.02-1.56-1.88c-.2-.25-.58-.24-.78.01l-1.74 2.23c-.26.33-.02.81.39.81h8.98c.41 0 .65-.47.4-.8l-2.55-3.39c-.19-.26-.59-.26-.79 0z"/></svg>
      PicFinder AI
    </div>
    <div class="ai-status-bar" id="aiStatusBar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Laddar AI-modell...</span>
    </div>
  </div>
  <h1 id="pageTitle">Bibliotek</h1>
</header>

<!-- ================= VYN: BIBLIOTEK ================= -->
<section class="view active" id="view-library">
  <div class="empty-state" id="emptyState">
    <div class="main-gradient-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
    </div>
    <h2>Ditt bibliotek är tomt</h2>
    <p>Välj foton från din enhet. Vår inbyggda AI analyserar och vektorindexerar dem direkt på din enhet.</p>
    <div class="btn-stacked">
      <button class="btn primary" id="btnSelectPhotos">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Välj bilder från enhet
      </button>
    </div>
  </div>

  <div id="filledLibrary" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
      <button class="btn secondary" id="btnAddMore" style="padding:10px 16px; font-size:14px; width:auto;">+ Lägg till bilder</button>
      <span style="font-size:13px; color:var(--text-muted);" id="libraryCountText">0 bilder</span>
    </div>
    <div class="grid" id="resultGrid"></div>
  </div>
</section>

<!-- ================= VYN: AI SÖK ================= -->
<section class="view" id="view-search">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="aiQueryInput" placeholder="Beskriv bilden (t.ex. 'röd bil', 'hund på gräs', 'solnedgång vid hav')...">
    <button class="search-btn-icon" id="btnRunSearch">Sök</button>
  </div>
  <div class="ai-feedback" id="searchFeedback"></div>
  <div class="grid" id="aiSearchGrid"></div>
</section>

<!-- ================= OVERLAYS ================= -->
<!-- AI Indexerings- & Laddningsoverlay -->
<div class="overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <h3 style="margin-top: 20px; font-weight: 700;" id="loadingTitle">Bearbetar...</h3>
  <p style="color: var(--text-muted); font-size: 14px; margin-top: 6px;" id="loadingDesc">Genererar semantiska vektorer</p>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>
</div>

<!-- Bildvisare -->
<div class="overlay" id="imageModal">
  <button class="modal-close" id="btnCloseModal">×</button>
  <img class="modal-content" id="modalImg" src="" alt="Full visning">
  <div class="modal-actions">
    <button class="modal-btn danger" id="btnDeletePhoto">🗑️ Radera från bibliotek</button>
  </div>
</div>

<div class="toast" id="toastMsg">Notis</div>

<!-- ================= TAB BAR ================= -->
<div class="tabbar-container">
  <nav class="tabbar">
    <button class="tab active" data-view="view-library" data-title="Bibliotek">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      Bibliotek
    </button>
    <button class="tab" data-view="view-search" data-title="Semantisk AI-sök">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      AI-Sök
    </button>
  </nav>
</div>

<!-- Import Transformers.js från CDN -->
<script type="module">
  import { pipeline, env, AutoTokenizer, CLIPTextModelWithProjection, AutoProcessor, CLIPVisionModelWithProjection, RawImage } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.14.0';

  // Inaktivera lokala filkontroller för webb-CDN
  env.allowLocalModels = false;

  // --- 1. INDEXEDDB VEKTORLAGRING ---
  const DB_NAME = 'PicFinderVectorDB';
  const DB_VERSION = 1;
  const STORE_NAME = 'photos';

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function getAllPhotosFromDB() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async function savePhotoToDB(photoItem) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.put(photoItem);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async function deletePhotoFromDB(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  // --- 2. MULTIMODAL AI-MOTOR (CLIP) ---
  let tokenizer = null;
  let textModel = null;
  let processor = null;
  let visionModel = null;
  let isAiReady = false;

  const MODEL_ID = 'Xenova/clip-vit-base-patch32';

  async function initMultimodalAI() {
    try {
      updateAIStatus('Laddar tokenizer...', false);
      tokenizer = await AutoTokenizer.from_pretrained(MODEL_ID);
      
      updateAIStatus('Laddar textmodell...', false);
      textModel = await CLIPTextModelWithProjection.from_pretrained(MODEL_ID);
      
      updateAIStatus('Laddar bildprocessor...', false);
      processor = await AutoProcessor.from_pretrained(MODEL_ID);
      
      updateAIStatus('Laddar visionsmodell...', false);
      visionModel = await CLIPVisionModelWithProjection.from_pretrained(MODEL_ID);

      isAiReady = true;
      updateAIStatus('AI Redo', true);
    } catch (err) {
      console.error("Fel vid laddning av AI-modell:", err);
      updateAIStatus('AI-Fel (Kolla nätverk)', false, true);
    }
  }

  function updateAIStatus(text, ready, error = false) {
    const dot = document.getElementById('statusDot');
    const label = document.getElementById('statusText');
    label.innerText = text;
    dot.className = 'status-dot' + (ready ? ' ready' : error ? ' error' : '');
  }

  // Generera bild-embedding (512-dim vektor)
  async function generateImageEmbedding(dataUrl) {
    const rawImg = await RawImage.fromURL(dataUrl);
    const imageInputs = await processor(rawImg);
    const { image_embeds } = await visionModel(imageInputs);
    return Array.from(image_embeds.data);
  }

  // Generera text-embedding (512-dim vektor)
  async function generateTextEmbedding(textQuery) {
    const textInputs = await tokenizer([textQuery], { padding: true, truncation: true });
    const { text_embeds } = await textModel(textInputs);
    return Array.from(text_embeds.data);
  }

  // --- 3. VEKTORSÖKNING & KOSINUSLIKHET ---
  function cosineSimilarity(vecA, vecB) {
    let dotProduct = 0.0;
    let normA = 0.0;
    let normB = 0.0;
    for (let i = 0; i < vecA.length; i++) {
      dotProduct += vecA[i] * vecB[i];
      normA += vecA[i] * vecA[i];
      normB += vecB[i] * vecB[i];
    }
    if (normA === 0 || normB === 0) return 0;
    return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
  }

  // --- 4. APP-LOGIK OCH UI-HANTERING ---
  let libraryPhotos = [];
  let selectedPhotoId = null;

  window.addEventListener('DOMContentLoaded', async () => {
    setupEventListeners();
    libraryPhotos = await getAllPhotosFromDB();
    renderLibraryGrid();
    initMultimodalAI();
  });

  function setupEventListeners() {
    document.getElementById('btnSelectPhotos').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('btnAddMore').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = (e) => handleFileSelection(e.target.files);
    
    document.getElementById('btnRunSearch').onclick = executeSemanticSearch;
    document.getElementById('aiQueryInput').onkeydown = (e) => { if(e.key === 'Enter') executeSemanticSearch(); };
    
    document.getElementById('btnCloseModal').onclick = closeModal;
    document.getElementById('btnDeletePhoto').onclick = deleteSelectedPhoto;

    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => switchTab(tab);
    });
  }

  function showLoading(title, desc) {
    document.getElementById('loadingTitle').innerText = title;
    document.getElementById('loadingDesc').innerText = desc;
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('loadingOverlay').classList.add('show');
  }

  function updateProgress(percent) {
    document.getElementById('progressBar').style.width = `${percent}%`;
  }

  function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('show');
  }

  function showToast(msg) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // Automatisk indexering av nya bilder
  async function handleFileSelection(files) {
    if (!files || files.length === 0) return;
    if (!isAiReady) {
      showToast("Vänta tills AI-modellen har laddats klart...");
      return;
    }

    showLoading("Indexerar bilder...", `Analyserar visuellt innehåll (0/${files.length})`);
    
    const fileList = Array.from(files);
    let completed = 0;

    for (let file of fileList) {
      const dataUrl = await readFileAsDataURL(file);
      const id = 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

      try {
        // Generera vektor-embedding med vision-modellen
        const embeddingVector = await generateImageEmbedding(dataUrl);

        const photoObject = {
          id: id,
          dataUrl: dataUrl,
          embedding: embeddingVector,
          createdAt: Date.now()
        };

        await savePhotoToDB(photoObject);
        libraryPhotos.unshift(photoObject);

      } catch (err) {
        console.error("Fel vid indexering av bild:", err);
      }

      completed++;
      updateProgress((completed / fileList.length) * 100);
      document.getElementById('loadingDesc').innerText = `Analyserar visuellt innehåll (${completed}/${fileList.length})`;
    }

    hideLoading();
    renderLibraryGrid();
    showToast(`${completed} ny(a) bild(er) indexerade!`);
  }

  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderLibraryGrid() {
    const emptyState = document.getElementById('emptyState');
    const filledLibrary = document.getElementById('filledLibrary');
    const grid = document.getElementById('resultGrid');
    const countText = document.getElementById('libraryCountText');

    if (libraryPhotos.length === 0) {
      emptyState.style.display = 'flex';
      filledLibrary.style.display = 'none';
      return;
    }

    emptyState.style.display = 'none';
    filledLibrary.style.display = 'block';
    countText.innerText = `${libraryPhotos.length} bilder`;

    grid.innerHTML = libraryPhotos.map(p => `
      <div class="grid-item" data-id="${p.id}">
        <img src="${p.dataUrl}" loading="lazy" alt="Bild">
      </div>
    `).join('');

    grid.querySelectorAll('.grid-item').forEach(el => {
      el.onclick = () => openModal(el.dataset.id);
    });
  }

  // Utför semantisk bildsökning med kosinuslikhet
  async function executeSemanticSearch() {
    const query = document.getElementById('aiQueryInput').value.trim();
    const feedback = document.getElementById('searchFeedback');
    const grid = document.getElementById('aiSearchGrid');

    if (!query) {
      feedback.innerText = '';
      grid.innerHTML = '';
      return;
    }

    if (!isAiReady) {
      showToast("AI-modellen laddas fortfarande...");
      return;
    }

    if (libraryPhotos.length === 0) {
      feedback.innerText = "Ditt bibliotek är tomt. Lägg till bilder först.";
      grid.innerHTML = '';
      return;
    }

    showLoading("Semantisk sökning...", "Vektoriserar din beskrivning");

    try {
      // 1. Skapa text-embedding för sökfrasen
      const queryEmbedding = await generateTextEmbedding(query);

      // 2. Beräkna likhetsgjälp mot alla bildvektorer i biblioteket
      const scoredResults = libraryPhotos.map(photo => {
        const simScore = cosineSimilarity(queryEmbedding, photo.embedding);
        return { photo, score: simScore };
      });
