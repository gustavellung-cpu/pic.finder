<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PicFinder</title>
  <style>
    /* =========================================
       VARIABLER & DARK MODE GRUNDINSTÄLLNINGAR
       ========================================= */
    :root {
      --bg-dark: #121214;
      --text-main: #ffffff;
      --text-muted: #9898a0;
      
      /* Knappar & Kort */
      --primary-btn: linear-gradient(90deg, #3a82f6, #1d4ed8);
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-hover: rgba(255, 255, 255, 0.1);
      
      /* Gradient Ikon */
      --icon-gradient: linear-gradient(135deg, #a855f7, #3b82f6);
    }

    * {
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, rgba(58, 130, 246, 0.1) 0%, transparent 70%);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      padding-bottom: 120px; /* Plats för flytande tabbar */
      min-height: 100vh;
    }

    /* =========================================
       HEADER (Som i bilden)
       ========================================= */
    header {
      padding: 20px 24px 10px;
    }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .top-bar .logo-small {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
    }
    
    .top-bar .logo-small svg {
      width: 18px; height: 18px;
      color: #8b5cf6;
    }

    header h1 {
      font-size: 34px; 
      font-weight: 800; 
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }
    
    header hr {
      border: none;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    /* =========================================
       VYZONER
       ========================================= */
    .view {
      display: none; 
      padding: 16px 24px 20px; 
      animation: fade 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .view.active { display: block; }
    
    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); } 
      to { opacity: 1; transform: translateY(0); }
    }

    /* =========================================
       EMPTY STATE (Exakt som bilden)
       ========================================= */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 40px;
    }

    .main-gradient-icon {
      width: 80px;
      height: 80px;
      background: var(--icon-gradient);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
    }

    .main-gradient-icon svg {
      width: 40px; height: 40px; color: white;
    }

    .empty-state h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-muted);
      max-width: 280px;
      margin-bottom: 30px;
    }

    /* Knappar */
    .btn-stacked {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      color: white;
      transition: transform 0.1s, background 0.2s;
    }

    .btn:active { transform: scale(0.97); }

    .btn.primary {
      background: var(--primary-btn);
      box-shadow: 0 4px 15px rgba(58, 130, 246, 0.3);
    }

    .btn.secondary {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .btn.secondary:active { background: var(--glass-hover); }

    /* =========================================
       SÖK & RUTNÄT (När biblioteket har bilder)
       ========================================= */
    .search-box {
      background: var(--glass-bg); 
      border: 1px solid var(--glass-border);
      border-radius: 18px; 
      padding: 14px 16px;
      display: flex; 
      align-items: center; 
      gap: 12px; 
      margin-bottom: 20px;
    }
    
    .search-box input {
      border: none; outline: none; flex: 1; font-size: 16px; 
      background: transparent; color: var(--text-main);
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box svg { color: var(--text-muted); width: 20px; height: 20px; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid img {
      width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px;
    }

    /* =========================================
       FLYTRANDE TAB BAR (I botten)
       ========================================= */
    .tabbar-container {
      position: fixed; 
      bottom: 30px; 
      left: 0; right: 0; 
      display: flex; 
      justify-content: center;
      z-index: 100;
      pointer-events: none; /* Låter klick passera igenom ytan runt om */
    }

    nav.tabbar {
      pointer-events: auto;
      display: flex; 
      align-items: center;
      background: rgba(30, 30, 34, 0.7); 
      backdrop-filter: blur(25px); 
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 40px;
      padding: 8px 16px;
      gap: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 4px; 
      color: var(--text-muted); font-size: 11px; font-weight: 500; 
      border: none; background: none; cursor: pointer;
      padding: 8px 12px;
      border-radius: 20px;
      transition: all 0.3s;
    }
    
    .tab svg { width: 24px; height: 24px; transition: all 0.3s; }
    
    .tab.active { 
      color: var(--text-main); 
    }
    .tab.active svg { 
      transform: scale(1.1); 
      stroke-width: 2.5;
    }

  </style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="logo-small">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 16H6c-.55 0-1-.45-1-1V6c0-.55.45-1 1-1h12c.55 0 1 .45 1 1v12c0 .55-.45 1-1 1zm-4.44-6.19l-2.35 3.02-1.56-1.88c-.2-.25-.58-.24-.78.01l-1.74 2.23c-.26.33-.02.81.39.81h8.98c.41 0 .65-.47.4-.8l-2.55-3.39c-.19-.26-.59-.26-.79 0z"/></svg>
      PicFinder
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-6M6 20V10M18 20V4"/></svg>
  </div>
  <h1 id="pageTitle">Library</h1>
  <hr>
</header>

<!-- =====================================
     VY: BIBLIOTEK (Standardvyn)
     ===================================== -->
<section class="view active" id="view-library">
  
  <!-- Empty State (Visas från början) -->
  <div class="empty-state" id="emptyState">
    <div class="main-gradient-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
    </div>
    
    <h2>Ditt bibliotek är tomt</h2>
    <p>Lägg till bilder från din kamerarulle så hittar PicFinder dem via en enkel beskrivning.</p>
    
    <div class="btn-stacked">
      <button class="btn primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Välj bilder
      </button>
      <button class="btn secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        Ge full åtkomst till galleri
      </button>
      <button class="btn secondary" onclick="loadSamplePhotos()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        Testa med exempelbilder
      </button>
    </div>
  </div>

  <!-- Fyllda biblioteket (Dolt från början) -->
  <div id="filledLibrary" style="display:none;">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="searchInput" placeholder="Sök t.ex. 'hund på stranden'..." oninput="runSearch()">
    </div>
    <div class="grid" id="resultGrid"></div>
  </div>
</section>

<!-- Placeholder vyer för tab-baren -->
<section class="view" id="view-albums"><h2 style="text-align:center; color:var(--text-muted); margin-top:50px;">Album kommer snart</h2></section>
<section class="view" id="view-search"><h2 style="text-align:center; color:var(--text-muted); margin-top:50px;">Smart AI-Sök</h2></section>

<!-- =====================================
     FLYTANDE TAB BAR
     ===================================== -->
<div class="tabbar-container">
  <nav class="tabbar">
    <button class="tab active" data-view="view-library" data-title="Library" onclick="switchTab(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      Bibliotek
    </button>
    
    <button class="tab" data-view="view-search" data-title="Search" onclick="switchTab(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      Sök
    </button>

    <button class="tab" data-view="view-albums" data-title="Albums" onclick="switchTab(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
      Album
    </button>
  </nav>
</div>

<!-- =====================================
     JAVASCRIPT
     ===================================== -->
<script>
  // Demodata från tidigare
  const photos = [
    {id:1, seed:'beach1', tags:['solnedgång','strand','hav','sommar']},
    {id:2, seed:'dog1', tags:['hund','husdjur','park']},
    {id:3, seed:'pizza1', tags:['mat','pizza','middag']},
    {id:4, seed:'mountain1', tags:['berg','natur','vandring']},
    {id:5, seed:'party1', tags:['fest','vänner','kväll']},
    {id:6, seed:'city1', tags:['stad','natt','lampor']},
    {id:7, seed:'cat1', tags:['katt','husdjur','soffa']},
    {id:8, seed:'coffee1', tags:['kaffe','morgon','café']},
    {id:9, seed:'snow1', tags:['snö','vinter','skidor']}
  ];

  const imgUrl = (seed) => `https://picsum.photos/seed/${seed}/300/300`;

  function renderGrid(list){
    document.getElementById('resultGrid').innerHTML = list.map(p => 
      `<img src="${imgUrl(p.seed)}" alt="${p.tags.join(', ')}">`
    ).join('');
  }

  // Ladda exempelbilder (Döljer empty state, visar grid)
  function loadSamplePhotos() {
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('filledLibrary').style.display = 'block';
    renderGrid(photos);
  }

  // Sökfunktion för live-sökning
  function runSearch(){
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if(!q){
      renderGrid(photos);
      return;
    }
    const words = q.split(/[\s,]+/).filter(Boolean);
    const filtered = photos.filter(p => 
      words.every(w => p.tags.some(t => t.includes(w)))
    );
    renderGrid(filtered);
  }

  // Byta flikar i tab-baren
  function switchTab(btn){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
    
    // Uppdatera sidans titel längst upp
    document.getElementById('pageTitle').innerText = btn.dataset.title;
  }
</script>
</body>
</html>
